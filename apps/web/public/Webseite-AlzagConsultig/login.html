<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Alzag Consulting</title>
    <meta name="description" content="Login für Alzag Consulting." />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://www.alzag-consulting.de/login.html" />

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png" />
    <link rel="manifest" href="assets/images/favicons/site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicons/favicon.ico" />
    <link rel="shortcut icon" href="assets/images/favicons/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/vendors/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/vendors/bootstrap-select/bootstrap-select.min.css" />
    <link rel="stylesheet" href="assets/vendors/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="assets/vendors/ogency-icons/style.css" />
    <link rel="stylesheet" href="assets/css/ogency.css" />

    <style>
        .portal-shell {
            min-height: 100vh;
            padding: 80px 0;
            background:
                radial-gradient(circle at 10% 15%, rgba(var(--ogency-base-rgb), 0.24), transparent 38%),
                radial-gradient(circle at 85% 82%, rgba(var(--ogency-base-rgb), 0.12), transparent 40%),
                linear-gradient(180deg, rgba(var(--ogency-black2-rgb), 1) 0%, rgba(15, 18, 24, 1) 100%);
        }

        .portal-grid {
            max-width: 520px;
            margin: 0 auto;
        }

        .portal-card {
            border-radius: 24px;
            border: 1px solid rgba(var(--ogency-white-rgb), 0.14);
            background: linear-gradient(160deg, rgba(var(--ogency-black2-rgb), 0.9), rgba(var(--ogency-black-rgb), 0.78));
            box-shadow: 0 22px 46px rgba(var(--ogency-black-rgb), 0.35);
            padding: clamp(26px, 3.2vw, 40px);
        }

        .portal-title {
            margin: 18px 0 0;
            color: var(--ogency-white);
            line-height: 1.1;
            font-size: clamp(30px, 4vw, 40px);
            text-align: center;
        }

        .portal-subtitle {
            margin: 10px 0 0;
            color: rgba(var(--ogency-white-rgb), 0.82);
            line-height: 1.6;
            text-align: center;
        }

        .portal-form {
            margin-top: 28px;
            display: grid;
            gap: 16px;
        }

        .portal-form[hidden] {
            display: none;
        }

        .portal-field {
            display: grid;
            gap: 8px;
        }

        .portal-label {
            color: rgba(var(--ogency-white-rgb), 0.82);
            text-transform: uppercase;
            letter-spacing: 0.11em;
            font-size: 11px;
            font-weight: 700;
        }

        .portal-input {
            width: 100%;
            border: 1px solid rgba(var(--ogency-white-rgb), 0.16);
            border-radius: 14px;
            background: rgba(var(--ogency-black-rgb), 0.45);
            color: var(--ogency-white);
            font-size: 16px;
            line-height: 1.2;
            padding: 14px 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .portal-input:focus {
            outline: none;
            border-color: rgba(var(--ogency-base-rgb), 0.95);
            box-shadow: 0 0 0 3px rgba(var(--ogency-base-rgb), 0.24);
        }

        .portal-input::placeholder {
            color: rgba(var(--ogency-white-rgb), 0.45);
        }

        .portal-password-wrap {
            position: relative;
        }

        .portal-password-wrap .portal-input {
            padding-right: 54px;
        }

        .portal-password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #000000;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .portal-password-toggle:hover,
        .portal-password-toggle:focus-visible {
            color: #000000;
            background: rgba(var(--ogency-white-rgb), 0.08);
            outline: none;
        }

        .portal-text-link {
            border: 0;
            background: none;
            padding: 2px 0 0;
            width: fit-content;
            color: rgba(var(--ogency-base-rgb), 0.98);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .portal-text-link:hover,
        .portal-text-link:focus-visible {
            color: #ffffff;
            outline: none;
        }

        .portal-status {
            margin-top: 16px;
            min-height: 22px;
            font-size: 14px;
            color: rgba(var(--ogency-white-rgb), 0.72);
        }

        .portal-status--error {
            color: #ff9ca6;
        }

        .portal-status--success {
            color: #90f4b0;
        }

        .portal-actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .portal-actions .ogency-btn {
            border: 0;
            cursor: pointer;
        }

        .portal-btn-secondary {
            background: rgba(var(--ogency-white-rgb), 0.08);
            color: var(--ogency-white);
        }

        .portal-code-hint {
            margin: 0;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(var(--ogency-base-rgb), 0.35);
            background: rgba(var(--ogency-base-rgb), 0.1);
            color: rgba(var(--ogency-white-rgb), 0.88);
            font-size: 14px;
        }

        .portal-dash {
            margin-top: 18px;
        }

        @media (max-width: 991px) {
            .portal-shell {
                padding: 64px 0;
            }

            .portal-actions .ogency-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main id="main-content">
        <section class="portal-shell" aria-label="Login">
            <div class="container">
                <div class="portal-grid">
                    <section class="portal-card" aria-labelledby="portal-login-title">
                        <div class="text-center">
                            <img src="assets/images/logo-light.png" width="160" height="64" alt="Alzag Consulting" loading="eager" fetchpriority="high" decoding="async" />
                        </div>
                        <h1 id="portal-login-title" class="portal-title">Login</h1>
                        <p class="portal-subtitle">Bitte melden Sie sich mit Ihren Zugangsdaten an.</p>

                        <noscript>
                            <p class="portal-status portal-status--error">Bitte aktivieren Sie JavaScript, um den Login zu verwenden.</p>
                        </noscript>

                        <form id="credentials-form" class="portal-form" autocomplete="off">
                            <div class="portal-field">
                                <label class="portal-label" for="login-email">E-Mail</label>
                                <input id="login-email" class="portal-input" type="email" required autocomplete="email" placeholder="name@unternehmen.de" />
                            </div>
                            <div class="portal-field">
                                <label class="portal-label" for="login-password">Passwort</label>
                                <div class="portal-password-wrap">
                                    <input id="login-password" class="portal-input" type="password" required autocomplete="current-password" placeholder="••••••••" />
                                    <button type="button" id="toggle-login-password" class="portal-password-toggle" data-password-target="login-password" aria-label="Passwort anzeigen" aria-pressed="false">
                                        <i class="fa fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button id="forgot-password-btn" type="button" class="portal-text-link">Passwort vergessen?</button>
                            <button type="submit" class="ogency-btn">Anmelden</button>
                        </form>

                        <form id="twofactor-form" class="portal-form" hidden autocomplete="off">
                            <p id="code-hint" class="portal-code-hint">Wir haben einen Sicherheitscode gesendet.</p>
                            <div class="portal-field">
                                <label class="portal-label" for="login-code">Sicherheitscode</label>
                                <input id="login-code" class="portal-input" type="text" inputmode="numeric" minlength="6" maxlength="6" required autocomplete="one-time-code" placeholder="123456" />
                            </div>
                            <button type="submit" class="ogency-btn">Code bestätigen</button>
                            <div class="portal-actions">
                                <button id="resend-code" type="button" class="ogency-btn portal-btn-secondary">Code erneut senden</button>
                                <button id="back-to-login" type="button" class="ogency-btn portal-btn-secondary">Zurück</button>
                            </div>
                        </form>

                        <form id="reset-request-form" class="portal-form" hidden autocomplete="off">
                            <p class="portal-code-hint">Wir senden einen Sicherheitscode an Ihre Login-E-Mail. Der Code ist 10 Minuten gültig.</p>
                            <div class="portal-field">
                                <label class="portal-label" for="reset-email">E-Mail</label>
                                <input id="reset-email" class="portal-input" type="email" autocomplete="email" placeholder="name@unternehmen.de" required />
                            </div>
                            <button type="submit" class="ogency-btn">Sicherheitscode senden</button>
                            <div class="portal-actions">
                                <button id="reset-request-back" type="button" class="ogency-btn portal-btn-secondary">Zurück zum Login</button>
                            </div>
                        </form>

                        <form id="reset-code-form" class="portal-form" hidden autocomplete="off">
                            <p id="reset-code-hint" class="portal-code-hint">Reset-Code eingeben.</p>
                            <div class="portal-field">
                                <label class="portal-label" for="reset-code">Reset-Code</label>
                                <input id="reset-code" class="portal-input" type="text" inputmode="numeric" minlength="6" maxlength="12" required autocomplete="one-time-code" placeholder="123456" />
                            </div>
                            <button type="submit" class="ogency-btn">Code bestätigen</button>
                            <div class="portal-actions">
                                <button id="reset-code-resend" type="button" class="ogency-btn portal-btn-secondary">Code erneut senden</button>
                                <button id="reset-code-back" type="button" class="ogency-btn portal-btn-secondary">Zurück</button>
                            </div>
                        </form>

                        <form id="reset-password-form" class="portal-form" hidden autocomplete="off">
                            <p class="portal-code-hint">Bitte neues Passwort setzen (mindestens 8 Zeichen).</p>
                            <div class="portal-field">
                                <label class="portal-label" for="reset-new-password">Neues Passwort</label>
                                <div class="portal-password-wrap">
                                    <input id="reset-new-password" class="portal-input" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Neues Passwort" />
                                    <button type="button" class="portal-password-toggle" data-password-target="reset-new-password" aria-label="Passwort anzeigen" aria-pressed="false">
                                        <i class="fa fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="portal-field">
                                <label class="portal-label" for="reset-confirm-password">Passwort bestätigen</label>
                                <div class="portal-password-wrap">
                                    <input id="reset-confirm-password" class="portal-input" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Passwort erneut eingeben" />
                                    <button type="button" class="portal-password-toggle" data-password-target="reset-confirm-password" aria-label="Passwort anzeigen" aria-pressed="false">
                                        <i class="fa fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="ogency-btn">Neues Passwort speichern</button>
                            <div class="portal-actions">
                                <button id="reset-password-back" type="button" class="ogency-btn portal-btn-secondary">Zurück</button>
                            </div>
                        </form>

                        <p id="portal-status" class="portal-status" role="status" aria-live="polite"></p>

                        <div class="portal-dash">
                            <button id="to-dashboard" type="button" class="ogency-btn portal-btn-secondary" hidden>Direkt weiter</button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/vendors/jquery/jquery-3.5.1.min.js"></script>
    <script src="assets/vendors/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendors/bootstrap-select/bootstrap-select.min.js"></script>
    <script src="assets/js/ogency.js"></script>
    <script src="assets/js/arcto-consent.js"></script>
    <script src="assets/js/arcto-tracking.js"></script>
    <script src="assets/js/alzag-guided-contact-panel.js"></script>
    <script>
        (function () {
            "use strict";

            var API_PREFIX = "/api/v1";
            var STORAGE_KEY = "arcto-crm-auth";
            var DEVICE_KEY = "arcto-crm-device-id";
            var DASHBOARD_PATH = "/dashboard";
            var CUSTOMER_HOME_PATH = "/kundenportal";

            var state = {
                email: "",
                password: "",
                deviceId: "",
                expiresAt: "",
                resetEmail: "",
                resetCode: "",
                resetExpiresAt: "",
                resetCodeValidated: false,
            };

            var credentialsForm = document.getElementById("credentials-form");
            var twoFactorForm = document.getElementById("twofactor-form");
            var resetRequestForm = document.getElementById("reset-request-form");
            var resetCodeForm = document.getElementById("reset-code-form");
            var resetPasswordForm = document.getElementById("reset-password-form");
            var emailInput = document.getElementById("login-email");
            var passwordInput = document.getElementById("login-password");
            var codeInput = document.getElementById("login-code");
            var resetEmailInput = document.getElementById("reset-email");
            var resetCodeInput = document.getElementById("reset-code");
            var resetNewPasswordInput = document.getElementById("reset-new-password");
            var resetConfirmPasswordInput = document.getElementById("reset-confirm-password");
            var statusNode = document.getElementById("portal-status");
            var codeHintNode = document.getElementById("code-hint");
            var resetCodeHintNode = document.getElementById("reset-code-hint");
            var resendButton = document.getElementById("resend-code");
            var backButton = document.getElementById("back-to-login");
            var forgotPasswordButton = document.getElementById("forgot-password-btn");
            var resetRequestBackButton = document.getElementById("reset-request-back");
            var resetCodeResendButton = document.getElementById("reset-code-resend");
            var resetCodeBackButton = document.getElementById("reset-code-back");
            var resetPasswordBackButton = document.getElementById("reset-password-back");
            var dashboardButton = document.getElementById("to-dashboard");
            var passwordToggleButtons = document.querySelectorAll(".portal-password-toggle[data-password-target]");

            function setStatus(message, type) {
                if (!statusNode) {
                    return;
                }
                statusNode.textContent = message || "";
                statusNode.classList.remove("portal-status--error", "portal-status--success");
                if (type === "error") {
                    statusNode.classList.add("portal-status--error");
                }
                if (type === "success") {
                    statusNode.classList.add("portal-status--success");
                }
            }

            function setBusy(form, busy) {
                if (!form) {
                    return;
                }
                var controls = form.querySelectorAll("input, button");
                controls.forEach(function (control) {
                    control.disabled = busy;
                });
                form.setAttribute("aria-busy", busy ? "true" : "false");
            }

            function sanitizeEmail(value) {
                return (value || "").trim().toLowerCase();
            }

            function getDeviceId() {
                try {
                    return window.localStorage.getItem(DEVICE_KEY) || "";
                } catch (error) {
                    return "";
                }
            }

            function persistDeviceId(value) {
                try {
                    window.localStorage.setItem(DEVICE_KEY, value);
                } catch (error) {
                    // ignore
                }
            }

            function generateDeviceId() {
                if (window.crypto && typeof window.crypto.randomUUID === "function") {
                    return window.crypto.randomUUID();
                }
                if (window.crypto && typeof window.crypto.getRandomValues === "function") {
                    var bytes = new Uint8Array(16);
                    window.crypto.getRandomValues(bytes);
                    return Array.from(bytes).map(function (entry) {
                        return entry.toString(16).padStart(2, "0");
                    }).join("");
                }
                return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
            }

            function ensureDeviceId() {
                var existing = getDeviceId();
                if (existing) {
                    return existing;
                }
                var next = generateDeviceId();
                persistDeviceId(next);
                return next;
            }

            function persistAuth(payload) {
                window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            }

            function getStoredSession() {
                try {
                    var raw = window.localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        return null;
                    }
                    var parsed = JSON.parse(raw);
                    if (!parsed || !parsed.tokens || !parsed.tokens.accessToken || !parsed.tokens.refreshToken) {
                        return null;
                    }
                    return parsed;
                } catch (error) {
                    return null;
                }
            }

            function setPasswordToggleState(button, input, isVisible) {
                if (!button || !input) {
                    return;
                }
                input.type = isVisible ? "text" : "password";
                button.setAttribute("aria-pressed", isVisible ? "true" : "false");
                button.setAttribute("aria-label", isVisible ? "Passwort verbergen" : "Passwort anzeigen");
                var icon = button.querySelector("i");
                if (!icon) {
                    return;
                }
                icon.classList.remove("fa-eye", "fa-eye-slash");
                icon.classList.add(isVisible ? "fa-eye-slash" : "fa-eye");
            }

            function setupPasswordToggle(button) {
                if (!button) {
                    return;
                }
                var targetId = button.getAttribute("data-password-target");
                if (!targetId) {
                    return;
                }
                var targetInput = document.getElementById(targetId);
                if (!targetInput) {
                    return;
                }
                setPasswordToggleState(button, targetInput, false);
                button.addEventListener("click", function () {
                    var shouldShow = targetInput.type === "password";
                    setPasswordToggleState(button, targetInput, shouldShow);
                });
            }

            passwordToggleButtons.forEach(function (button) {
                setupPasswordToggle(button);
            });

            function showView(view) {
                if (credentialsForm) {
                    credentialsForm.hidden = view !== "credentials";
                }
                if (twoFactorForm) {
                    twoFactorForm.hidden = view !== "twofactor";
                }
                if (resetRequestForm) {
                    resetRequestForm.hidden = view !== "reset-request";
                }
                if (resetCodeForm) {
                    resetCodeForm.hidden = view !== "reset-code";
                }
                if (resetPasswordForm) {
                    resetPasswordForm.hidden = view !== "reset-password";
                }
                if (view === "twofactor" && codeInput) {
                    codeInput.focus();
                }
                if (view === "reset-request" && resetEmailInput) {
                    resetEmailInput.focus();
                }
                if (view === "reset-code" && resetCodeInput) {
                    resetCodeInput.focus();
                }
                if (view === "reset-password" && resetNewPasswordInput) {
                    resetNewPasswordInput.focus();
                }
            }

            function prepareResetEmail() {
                var value = sanitizeEmail(resetEmailInput && resetEmailInput.value ? resetEmailInput.value : "");
                if (!value) {
                    value = sanitizeEmail(emailInput && emailInput.value ? emailInput.value : "");
                }
                if (!value) {
                    value = sanitizeEmail(state.email);
                }
                state.resetEmail = value;
                if (resetEmailInput) {
                    resetEmailInput.value = value;
                }
                return value;
            }

            function toReadableTime(value) {
                if (!value) {
                    return "";
                }
                var parsed = new Date(value);
                if (Number.isNaN(parsed.getTime())) {
                    return "";
                }
                return parsed.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
            }

            function resolveTargetPath(role) {
                return role === "CUSTOMER" ? CUSTOMER_HOME_PATH : DASHBOARD_PATH;
            }

            function redirectToHome(role) {
                window.location.assign(resolveTargetPath(role));
            }

            async function apiPost(path, payload, fallbackMessage) {
                var response;
                try {
                    response = await fetch(API_PREFIX + path, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload),
                        cache: "no-store"
                    });
                } catch (error) {
                    throw new Error("API-Verbindung fehlgeschlagen.");
                }

                var data = null;
                try {
                    data = await response.json();
                } catch (error) {
                    data = null;
                }

                if (!response.ok) {
                    var message = (data && (data.message || data.error)) || fallbackMessage || "Anfrage fehlgeschlagen.";
                    throw new Error(message);
                }

                return data;
            }

            async function requestLogin() {
                if (!state.email || !state.password) {
                    throw new Error("Bitte E-Mail und Passwort eingeben.");
                }
                state.deviceId = ensureDeviceId();
                var response = await apiPost("/auth/login", {
                    email: state.email,
                    password: state.password,
                    deviceId: state.deviceId
                }, "Login fehlgeschlagen.");

                if (response && response.requiresTwoFactor) {
                    state.deviceId = response.deviceId || state.deviceId;
                    state.expiresAt = response.expiresAt || "";
                    persistDeviceId(state.deviceId);
                    var readable = toReadableTime(state.expiresAt);
                    if (codeHintNode) {
                        codeHintNode.textContent = readable
                            ? "Wir haben einen Sicherheitscode gesendet. Gültig bis " + readable + " Uhr."
                            : "Wir haben einen Sicherheitscode gesendet.";
                    }
                    showView("twofactor");
                    setStatus("Bitte 6-stelligen Code eingeben.", "success");
                    return;
                }

                persistAuth(response);
                setStatus("Erfolgreich angemeldet. Weiterleitung läuft ...", "success");
                redirectToHome(response && response.user ? response.user.role : null);
            }

            async function verifyCode() {
                var code = (codeInput && codeInput.value ? codeInput.value : "").trim();
                if (!code) {
                    throw new Error("Bitte den Sicherheitscode eingeben.");
                }
                var response = await apiPost("/auth/login/verify", {
                    email: state.email,
                    code: code,
                    deviceId: state.deviceId || ensureDeviceId()
                }, "Code ungültig.");
                persistAuth(response);
                setStatus("Code bestätigt. Weiterleitung läuft ...", "success");
                redirectToHome(response && response.user ? response.user.role : null);
            }

            function updateResetCodeHint() {
                if (!resetCodeHintNode) {
                    return;
                }
                var readable = toReadableTime(state.resetExpiresAt);
                resetCodeHintNode.textContent = readable
                    ? "Reset-Code eingeben. Gültig bis " + readable + " Uhr."
                    : "Reset-Code eingeben.";
            }

            async function requestPasswordReset() {
                var email = prepareResetEmail();
                if (!email) {
                    throw new Error("Bitte eine gültige E-Mail eingeben.");
                }
                var response = await apiPost("/auth/password-reset/request", {
                    email: email
                }, "Reset-Code konnte nicht gesendet werden.");

                state.resetCode = "";
                state.resetCodeValidated = false;
                state.resetExpiresAt = response && response.expiresAt ? response.expiresAt : "";
                if (resetCodeInput) {
                    resetCodeInput.value = "";
                }
                updateResetCodeHint();
                showView("reset-code");
                setStatus(
                    (response && response.message) || "Falls ein Konto existiert, haben wir einen Reset-Code gesendet.",
                    "success"
                );
            }

            async function verifyPasswordResetCode() {
                var email = prepareResetEmail();
                var code = (resetCodeInput && resetCodeInput.value ? resetCodeInput.value : "").trim();
                if (!email) {
                    throw new Error("E-Mail-Adresse fehlt.");
                }
                if (!code || code.length < 6) {
                    throw new Error("Bitte den vollständigen Reset-Code eingeben.");
                }

                var response = await apiPost("/auth/password-reset/verify", {
                    email: email,
                    code: code
                }, "Reset-Code konnte nicht bestätigt werden.");

                state.resetCode = code;
                state.resetCodeValidated = true;
                state.resetExpiresAt = response && response.expiresAt ? response.expiresAt : state.resetExpiresAt;
                updateResetCodeHint();
                showView("reset-password");
                setStatus(
                    (response && response.message) || "Code akzeptiert. Bitte neues Passwort setzen.",
                    "success"
                );
            }

            async function confirmPasswordReset() {
                if (!state.resetCodeValidated) {
                    throw new Error("Bitte zuerst den Reset-Code bestätigen.");
                }

                var email = prepareResetEmail();
                var code = state.resetCode;
                var newPassword = resetNewPasswordInput && resetNewPasswordInput.value ? resetNewPasswordInput.value : "";
                var confirmPassword = resetConfirmPasswordInput && resetConfirmPasswordInput.value ? resetConfirmPasswordInput.value : "";

                if (!email) {
                    throw new Error("E-Mail-Adresse fehlt.");
                }
                if (!code) {
                    throw new Error("Reset-Code fehlt.");
                }
                if (!newPassword || newPassword.length < 8) {
                    throw new Error("Das neue Passwort muss mindestens 8 Zeichen haben.");
                }
                if (newPassword !== confirmPassword) {
                    throw new Error("Neues Passwort und Bestätigung stimmen nicht überein.");
                }

                await apiPost("/auth/password-reset/confirm", {
                    email: email,
                    code: code,
                    newPassword: newPassword
                }, "Passwort konnte nicht zurückgesetzt werden.");

                state.resetCode = "";
                state.resetCodeValidated = false;
                state.resetExpiresAt = "";
                if (resetCodeInput) {
                    resetCodeInput.value = "";
                }
                if (resetNewPasswordInput) {
                    resetNewPasswordInput.value = "";
                }
                if (resetConfirmPasswordInput) {
                    resetConfirmPasswordInput.value = "";
                }
                if (passwordInput) {
                    passwordInput.value = "";
                }
                if (emailInput && !emailInput.value) {
                    emailInput.value = email;
                }

                showView("credentials");
                setStatus("Passwort zurückgesetzt. Bitte mit dem neuen Passwort anmelden.", "success");
            }

            if (dashboardButton) {
                dashboardButton.addEventListener("click", function () {
                    var session = getStoredSession();
                    var role = session && session.user ? session.user.role : null;
                    redirectToHome(role);
                });
            }

            var storedSession = getStoredSession();
            if (storedSession) {
                if (dashboardButton) {
                    var targetPath = resolveTargetPath(storedSession.user && storedSession.user.role);
                    dashboardButton.hidden = false;
                    dashboardButton.textContent = targetPath === CUSTOMER_HOME_PATH
                        ? "Direkt zum Kundenbereich"
                        : "Direkt zum Dashboard";
                }
                setStatus("Es ist bereits eine Sitzung gespeichert.", "success");
            }

            showView("credentials");

            if (credentialsForm) {
                credentialsForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    state.email = sanitizeEmail(emailInput && emailInput.value ? emailInput.value : "");
                    state.password = passwordInput && passwordInput.value ? passwordInput.value : "";
                    setBusy(credentialsForm, true);
                    setStatus("Login wird geprüft ...");
                    try {
                        await requestLogin();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Login fehlgeschlagen.", "error");
                    } finally {
                        setBusy(credentialsForm, false);
                    }
                });
            }

            if (twoFactorForm) {
                twoFactorForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    setBusy(twoFactorForm, true);
                    setStatus("Code wird geprüft ...");
                    try {
                        await verifyCode();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Code ungültig.", "error");
                    } finally {
                        setBusy(twoFactorForm, false);
                    }
                });
            }

            if (resendButton) {
                resendButton.addEventListener("click", async function () {
                    if (!state.email || !state.password) {
                        setStatus("Bitte zuerst E-Mail und Passwort erneut eingeben.", "error");
                        showView("credentials");
                        return;
                    }
                    setBusy(twoFactorForm, true);
                    setStatus("Neuer Code wird angefordert ...");
                    try {
                        await requestLogin();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Code konnte nicht neu gesendet werden.", "error");
                    } finally {
                        setBusy(twoFactorForm, false);
                    }
                });
            }

            if (backButton) {
                backButton.addEventListener("click", function () {
                    if (codeInput) {
                        codeInput.value = "";
                    }
                    setStatus("");
                    showView("credentials");
                });
            }

            if (forgotPasswordButton) {
                forgotPasswordButton.addEventListener("click", function () {
                    prepareResetEmail();
                    setStatus("");
                    showView("reset-request");
                });
            }

            if (resetRequestForm) {
                resetRequestForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    setBusy(resetRequestForm, true);
                    setStatus("Sicherheitscode wird angefordert ...");
                    try {
                        await requestPasswordReset();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Reset-Code konnte nicht gesendet werden.", "error");
                    } finally {
                        setBusy(resetRequestForm, false);
                    }
                });
            }

            if (resetRequestBackButton) {
                resetRequestBackButton.addEventListener("click", function () {
                    setStatus("");
                    showView("credentials");
                });
            }

            if (resetCodeForm) {
                resetCodeForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    setBusy(resetCodeForm, true);
                    setStatus("Reset-Code wird geprüft ...");
                    try {
                        await verifyPasswordResetCode();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Reset-Code konnte nicht bestätigt werden.", "error");
                    } finally {
                        setBusy(resetCodeForm, false);
                    }
                });
            }

            if (resetCodeResendButton) {
                resetCodeResendButton.addEventListener("click", async function () {
                    setBusy(resetCodeForm, true);
                    setStatus("Neuer Reset-Code wird angefordert ...");
                    try {
                        await requestPasswordReset();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Reset-Code konnte nicht gesendet werden.", "error");
                    } finally {
                        setBusy(resetCodeForm, false);
                    }
                });
            }

            if (resetCodeBackButton) {
                resetCodeBackButton.addEventListener("click", function () {
                    setStatus("");
                    showView("reset-request");
                });
            }

            if (resetPasswordForm) {
                resetPasswordForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    setBusy(resetPasswordForm, true);
                    setStatus("Passwort wird aktualisiert ...");
                    try {
                        await confirmPasswordReset();
                    } catch (error) {
                        setStatus(error instanceof Error ? error.message : "Passwort konnte nicht zurückgesetzt werden.", "error");
                    } finally {
                        setBusy(resetPasswordForm, false);
                    }
                });
            }

            if (resetPasswordBackButton) {
                resetPasswordBackButton.addEventListener("click", function () {
                    setStatus("");
                    showView("reset-code");
                });
            }
        })();
    </script>
</body>
</html>
